name: Fetch Mozilla SpiderMonkey shells

on:
  push:
    branches:
      - security-shell-fetch-20260910

permissions:
  contents: read

jobs:
  current:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python -m pip install --upgrade pip fuzzfetch
      - name: Fetch and package current ASan fuzzing shell
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p artifacts/current
          python -m fuzzfetch \
            --target js \
            --os Linux \
            --cpu x86_64 \
            --asan \
            --fuzzing \
            --name js \
            --out artifacts/current
          find artifacts/current -maxdepth 5 -ls
          JS=$(find artifacts/current -type f -name js -perm -111 -print -quit)
          test -n "$JS"
          "$JS" --version | tee artifacts/current/version.txt
          sha256sum "$JS" | tee artifacts/current/sha256.txt
          tar -C artifacts -czf current-asan-jsshell.tar.gz current
      - uses: actions/upload-artifact@v4
        with:
          name: current-asan-jsshell
          path: current-asan-jsshell.tar.gz
          if-no-files-found: error
          retention-days: 1

  historical:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python -m pip install --upgrade pip fuzzfetch
      - name: Fetch and package September 1 ASan fuzzing shell
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p artifacts/2026-09-01
          python -m fuzzfetch \
            --target js \
            --os Linux \
            --cpu x86_64 \
            --asan \
            --fuzzing \
            --build 2026-09-01 \
            --name js \
            --out artifacts/2026-09-01
          find artifacts/2026-09-01 -maxdepth 5 -ls
          JS=$(find artifacts/2026-09-01 -type f -name js -perm -111 -print -quit)
          test -n "$JS"
          "$JS" --version | tee artifacts/2026-09-01/version.txt
          sha256sum "$JS" | tee artifacts/2026-09-01/sha256.txt
          tar -C artifacts -czf 2026-09-01-asan-jsshell.tar.gz 2026-09-01
      - uses: actions/upload-artifact@v4
        with:
          name: 2026-09-01-asan-jsshell
          path: 2026-09-01-asan-jsshell.tar.gz
          if-no-files-found: error
          retention-days: 1
