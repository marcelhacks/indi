name: JSPI cross-zone execution proof

on:
  push:
    branches:
      - security-shell-fetch-20260910

permissions:
  actions: read
  contents: read

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shell:
          - current
          - historical
        include:
          - shell: current
            artifact: current-asan-jsshell
          - shell: historical
            artifact: 2026-09-01-asan-jsshell

    steps:
      - uses: actions/checkout@v4

      - name: Download fetched shell artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: downloaded
          github-token: ${{ github.token }}
          repository: marcelhacks/indi
          run-id: 34449710815

      - name: Extract shell
        shell: bash
        run: |
          set -euxo pipefail
          ARCHIVE=$(find downloaded -type f -name '*.tar.gz' -print -quit)
          test -n "$ARCHIVE"
          mkdir shell
          tar -xzf "$ARCHIVE" -C shell
          JS=$(find shell -type f -name js -perm -111 -print -quit)
          test -n "$JS"
          echo "JS=$JS" >> "$GITHUB_ENV"
          echo "JS_DIR=$(dirname "$JS")" >> "$GITHUB_ENV"

      - name: Record shell identity
        shell: bash
        env:
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1:symbolize=1
        run: |
          "$JS" --version 2>&1 | tee shell-version.txt
          sha256sum "$JS" | tee shell-sha256.txt

      - name: Execute cross-zone ownership diagnostics
        shell: bash
        env:
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1:symbolize=1:strict_string_checks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          LD_LIBRARY_PATH: ${{ env.JS_DIR }}
        run: |
          cat > cross-zone.js <<'EOF'
          "use strict";

          if (typeof ignoreUnhandledRejections === "function") {
            ignoreUnhandledRejections();
          }

          function event(name, data) {
            print("P1_EVENT " + JSON.stringify(Object.assign({name}, data || {})));
          }

          function fail(message, data) {
            event("FAIL", Object.assign({message}, data || {}));
            quit(65);
          }

          function errorText(e) {
            try {
              return String(e) + (e && e.stack ? "\n" + e.stack : "");
            } catch (_) {
              return "<unprintable>";
            }
          }

          const api = {
            suspending: typeof WebAssembly.Suspending,
            promising: typeof WebAssembly.promising,
            newGlobal: typeof newGlobal,
            gc: typeof gc,
            schedulezone: typeof schedulezone,
            nukeCCW: typeof nukeCCW,
            drainJobQueue: typeof drainJobQueue,
            addMarkObservers: typeof addMarkObservers,
            getMarks: typeof getMarks,
            clearKeptObjects: typeof clearKeptObjects,
            jspiEnabled: typeof wasmJSPromiseIntegrationEnabled === "function"
              ? wasmJSPromiseIntegrationEnabled()
              : null,
            build: typeof getBuildConfiguration === "function"
              ? getBuildConfiguration()
              : null,
          };
          event("api", api);

          for (const key of ["suspending", "promising", "newGlobal", "gc",
                             "schedulezone", "nukeCCW", "drainJobQueue",
                             "addMarkObservers", "getMarks", "clearKeptObjects"]) {
            if (api[key] !== "function") {
              event("SKIP", {reason: "missing API", api: key});
              quit(77);
            }
          }
          if (api.jspiEnabled !== true) {
            event("SKIP", {reason: "JSPI disabled"});
            quit(77);
          }

          const WAT = `(module
            (import "m" "wait" (func $wait (result i32)))
            (func (export "run") (param externref) (result i32)
              (local $held externref)
              local.get 0
              local.set $held
              call $wait
              local.get $held
              ref.is_null
              if (result i32)
                i32.const -100000
              else
                i32.const 287454020
              end
              i32.add))`;

          function setup(label) {
            let source = newGlobal({newCompartment: true});
            let foreign = newGlobal({newCompartment: true});

            foreign.eval(`
              var resolveForeign;
              var rejectForeign;
              var foreignPromise = new Promise((resolve, reject) => {
                resolveForeign = resolve;
                rejectForeign = reject;
              });
              function getForeignPromise() { return foreignPromise; }
              function settleForeign(value) { resolveForeign(value); }
              function rejectIt(value) { rejectForeign(value); }
            `);

            source.caseLabel = label;
            source.foreignGetPromise = foreign.getForeignPromise;
            source.eval(`
              var completionCount = 0;
              var completion = null;
              var liveObject = {marker: 0x11223344, label: caseLabel};
              var weakLiveObject = new WeakRef(liveObject);
              var suspending = new WebAssembly.Suspending(function () {
                return foreignGetPromise();
              });
              var instance = wasmEvalText(${JSON.stringify(WAT)}, {
                m: {wait: suspending}
              });
              var weakInstance = new WeakRef(instance);
              var promising = WebAssembly.promising(instance.exports.run);
              var outerPromise = promising(liveObject);
              outerPromise.then(
                value => {
                  completionCount++;
                  completion = {kind: "fulfilled", value};
                  print("P1_SOURCE_COMPLETION " + JSON.stringify({
                    label: caseLabel,
                    kind: "fulfilled",
                    value,
                    count: completionCount
                  }));
                },
                error => {
                  completionCount++;
                  completion = {kind: "rejected", error: String(error)};
                  print("P1_SOURCE_COMPLETION " + JSON.stringify({
                    label: caseLabel,
                    kind: "rejected",
                    error: String(error),
                    count: completionCount
                  }));
                }
              );
            `);

            // Run PromiseResolve's thenable-assimilation job so the unresolved
            // foreign-zone Promise is the remaining asynchronous owner.
            drainJobQueue();
            return {source, foreign};
          }

          function dropOrdinarySourceRoots(source) {
            source.eval(`
              liveObject = null;
              instance = null;
              promising = null;
              suspending = null;
              outerPromise = null;
              foreignGetPromise = null;
              clearKeptObjects();
            `);
          }

          function sourceState(source) {
            return JSON.parse(source.eval(`
              var state = {
                liveObject: weakLiveObject.deref() !== undefined,
                instance: weakInstance.deref() !== undefined,
                completionCount,
                completion
              };
              clearKeptObjects();
              JSON.stringify(state);
            `));
          }

          // Control 1: a foreign-zone unresolved Promise must keep the source
          // continuation, its Wasm instance and a live externref stack local alive.
          {
            let pair = setup("gc-only");
            dropOrdinarySourceRoots(pair.source);
            gc(pair.source);
            gc(pair.source);
            let before = sourceState(pair.source);
            event("gc_only_before_settle", before);
            if (!before.liveObject || !before.instance || before.completionCount !== 0) {
              fail("suspended continuation did not retain source state", before);
            }

            pair.foreign.eval("settleForeign(17)");
            drainJobQueue();
            let after = sourceState(pair.source);
            event("gc_only_after_settle", after);
            if (after.completionCount !== 1 ||
                !after.completion ||
                after.completion.kind !== "fulfilled" ||
                after.completion.value !== 287454037) {
              fail("cross-zone continuation resumed incorrectly", after);
            }
          }

          // Control 2: the public JSPI constructors reject direct
          // cross-compartment callable wrappers. This checks whether a foreign
          // zone can directly own the ContObject reaction at all.
          {
            let a = newGlobal({newCompartment: true});
            let b = newGlobal({newCompartment: true});
            b.eval("function foreignCallable() { return Promise.resolve(1); }");
            a.foreignCallable = b.foreignCallable;
            let result = a.eval(`
              try {
                new WebAssembly.Suspending(foreignCallable);
                "accepted";
              } catch (e) {
                "rejected:" + e.name + ":" + e.message;
              }
            `);
            event("direct_foreign_suspending", {result});
          }

          // Destructive case: observe the actual source-zone referents, discard
          // normal roots, schedule only the source zone, nuke its CCWs, collect,
          // and only then settle the still-live foreign Promise.
          {
            let pair = setup("nuke-source");
            pair.source.eval(`
              addMarkObservers([weakLiveObject.deref(), weakInstance.deref()]);
              clearKeptObjects();
            `);
            dropOrdinarySourceRoots(pair.source);

            schedulezone(pair.source);
            nukeCCW(pair.source);
            pair.source = null;
            clearKeptObjects();
            gc();
            let marks = getMarks();
            event("nuked_source_marks_before_settle", {marks});

            pair.foreign.eval("settleForeign(29)");
            drainJobQueue();
            event("nuked_source_settlement_drained", {marks});
          }

          event("PASS", {message: "all diagnostics completed without sanitizer or invariant failure"});
          EOF

          set +e
          timeout 180 "$JS" cross-zone.js > cross-zone.log 2>&1
          rc=$?
          set -e
          cat cross-zone.log
          echo "$rc" | tee cross-zone.rc

      - name: Classify execution
        shell: bash
        run: |
          rc=$(cat cross-zone.rc)
          if grep -Eqi 'AddressSanitizer|UndefinedBehaviorSanitizer|heap-use-after-free|use-after-free|SEGV|MOZ_CRASH|Assertion failure' cross-zone.log; then
            echo 'CLASSIFICATION=MEMORY_SAFETY_OR_FATAL_SIGNAL' | tee classification.txt
          elif grep -q 'P1_EVENT {"name":"FAIL"' cross-zone.log; then
            echo 'CLASSIFICATION=LIFETIME_INVARIANT_FAILURE' | tee classification.txt
          elif [ "$rc" -eq 0 ] && grep -q 'P1_EVENT {"name":"PASS"' cross-zone.log; then
            echo 'CLASSIFICATION=NO_FAILURE_REPRODUCED' | tee classification.txt
          elif [ "$rc" -eq 77 ]; then
            echo 'CLASSIFICATION=FEATURE_UNAVAILABLE' | tee classification.txt
          else
            echo "CLASSIFICATION=HARNESS_OR_UNKNOWN_FAILURE rc=$rc" | tee classification.txt
          fi
          cat classification.txt

      - name: Upload execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jspi-cross-zone-proof-${{ matrix.shell }}
          path: |
            shell-version.txt
            shell-sha256.txt
            cross-zone.js
            cross-zone.log
            cross-zone.rc
            classification.txt
          if-no-files-found: warn
          retention-days: 1
